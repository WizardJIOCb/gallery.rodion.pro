<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f8" />
    <title>gallery.rodion.pro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">gallery.rodion.pro</p>
          <h1>Галерея web-проектов</h1>
        </div>
        <button class="primary-button" id="newProjectButton" type="button">+ Проект</button>
      </header>

      <section class="workspace">
        <section class="panel library-panel" aria-label="Список проектов">
          <div class="toolbar">
            <label class="search-field">
              <span class="visually-hidden">Поиск</span>
              <input id="searchInput" type="search" placeholder="Поиск по названию, тегам, ссылкам" />
            </label>
            <select id="statusFilter" aria-label="Статус">
              <option value="all">Все статусы</option>
              <option value="testing">Тестирую</option>
              <option value="draft">Черновик</option>
              <option value="ready">Готово</option>
              <option value="archived">Архив</option>
            </select>
          </div>

          <div class="stats" aria-label="Статистика">
            <div>
              <span id="totalCount">0</span>
              <small>всего</small>
            </div>
            <div>
              <span id="testingCount">0</span>
              <small>в тесте</small>
            </div>
            <div>
              <span id="readyCount">0</span>
              <small>готово</small>
            </div>
          </div>

          <div class="project-grid" id="projectGrid"></div>
          <div class="empty-state" id="emptyState" hidden>
            <h2>Проектов пока нет</h2>
            <p>Добавь первый сайт, прототип или локальный dev server.</p>
            <button class="secondary-button" id="emptyAddButton" type="button">Добавить проект</button>
          </div>
        </section>

        <aside class="panel detail-panel" aria-label="Детали проекта">
          <div class="detail-empty" id="detailEmpty">
            <h2>Выбери проект</h2>
            <p>Здесь появятся ссылка, заметки и быстрые данные для проверки.</p>
          </div>

          <article class="project-detail" id="projectDetail" hidden>
            <div id="detailPreview"></div>
            <div class="detail-heading">
              <div>
                <p class="status-pill" id="detailStatus"></p>
                <h2 id="detailTitle"></h2>
              </div>
              <div class="icon-actions">
                <button class="icon-button" id="editButton" type="button" title="Редактировать" aria-label="Редактировать">✎</button>
                <button class="icon-button danger" id="deleteButton" type="button" title="Удалить" aria-label="Удалить">×</button>
              </div>
            </div>
            <p id="detailDescription"></p>
            <div class="tag-list" id="detailTags"></div>
            <dl class="meta-list">
              <div>
                <dt>URL</dt>
                <dd id="detailUrl"></dd>
              </div>
              <div>
                <dt>Обновлено</dt>
                <dd id="detailUpdated"></dd>
              </div>
            </dl>
            <div class="notes-block">
              <h3>Заметки</h3>
              <p id="detailNotes"></p>
            </div>
            <a class="primary-link" id="openProjectLink" href="#" target="_blank" rel="noreferrer">Открыть проект</a>
          </article>
        </aside>
      </section>
    </main>

    <dialog class="project-dialog" id="projectDialog">
      <form method="dialog" id="projectForm" class="project-form">
        <div class="form-header">
          <h2 id="formTitle">Новый проект</h2>
          <button class="icon-button" value="cancel" type="button" id="closeDialogButton" title="Закрыть" aria-label="Закрыть">×</button>
        </div>

        <input type="hidden" id="projectId" />

        <label>
          <span>Название</span>
          <input id="projectName" required maxlength="80" autocomplete="off" />
        </label>

        <label>
          <span>Ссылка</span>
          <input id="projectUrl" required inputmode="url" placeholder="http://localhost:5173" />
        </label>

        <label>
          <span>Описание</span>
          <textarea id="projectDescription" rows="3" maxlength="220"></textarea>
        </label>

        <div class="form-row">
          <label>
            <span>Статус</span>
            <select id="projectStatus">
              <option value="testing">Тестирую</option>
              <option value="draft">Черновик</option>
              <option value="ready">Готово</option>
              <option value="archived">Архив</option>
            </select>
          </label>

          <label>
            <span>Дата</span>
            <input id="projectUpdated" type="date" />
          </label>
        </div>

        <label>
          <span>Теги</span>
          <input id="projectTags" placeholder="react, three.js, experiment" />
        </label>

        <label>
          <span>Превью</span>
          <input id="projectImage" inputmode="url" placeholder="https://..." />
        </label>

        <label>
          <span>Заметки</span>
          <textarea id="projectNotes" rows="4"></textarea>
        </label>

        <div class="form-actions">
          <button class="secondary-button" type="button" id="cancelButton">Отмена</button>
          <button class="primary-button" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>

    <script src="app.js" defer></script>
  </body>
</html>
